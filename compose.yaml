services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: recalltrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: recalltrace
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recalltrace"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:

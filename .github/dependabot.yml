# Weekly checks for vulnerable or outdated dependencies. Python requirements are locked
# with hashes by uv (see requirements.in); Dependabot proposes updates as pull requests,
# which must pass CI before anyone merges them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

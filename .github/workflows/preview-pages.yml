name: Publish read-only frontend preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/preview-pages.yml
      - app/preview*.py
      - app/templates/**
      - app/static/**
      - scripts/export_preview.py
      - documentation/FRONTEND_PREVIEW.md
      - requirements.in
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RECALLTRACE_PREVIEW: read-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Export fictional read-only pages
        run: python scripts/export_preview.py --base-path /Recall-Trace --output _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The owner must first select Settings > Pages > Source > GitHub Actions.
      # Enabling Pages itself needs account permissions beyond this workflow.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy read-only preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
